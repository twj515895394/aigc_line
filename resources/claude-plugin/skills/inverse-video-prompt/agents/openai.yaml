interface:
  display_name: "视频提示词反推"
  short_description: "专业反推镜头、空间站位、视线轴线、动作表演、光影材质与节奏，并生成可直接使用的视频提示词"
  default_prompt: "使用 $inverse-video-prompt 分析这个参考视频，按时间线专业拆解镜头、主体动作、人物表演与微表情、构图、空间站位、屏幕左右、前后层级、身体朝向、视线、遮挡、背景锚点、180°轴线、运镜、光影、材质、风格与节奏；重点把抽象情绪转成可见表演、把动作事件写出运动质感、把运镜术语写成实际画面效果，补充 OTS、正反打、Master Shot、Two-shot、POV、Reaction Shot 等有证据的镜头语法，并根据画面推荐适合视频模型参考的声音设计，最终反推出丰富、忠实、可直接用于视频生成模型的提示词。"
